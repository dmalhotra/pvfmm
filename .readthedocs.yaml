# Read the Docs configuration (https://docs.readthedocs.io/en/stable/config-file/v2.html)
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  apt_packages:
    - doxygen        # XML consumed by breathe (invoked from docs/conf.py)

# The docs doxygen run parses only include/pvfmm*.h[pp] and friends;
# the SCTL submodule is not needed.
submodules:
  include: []

sphinx:
  configuration: docs/conf.py
  fail_on_warning: true

python:
  install:
    - requirements: docs/requirements.txt
